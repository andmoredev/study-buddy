<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Owl head shape -->
  <circle cx="16" cy="17" r="13" fill="#4CAF50"/>
  <!-- Ear tufts -->
  <polygon points="5,8 8,14 3,13" fill="#388E3C"/>
  <polygon points="27,8 24,14 29,13" fill="#388E3C"/>
  <!-- Face disc -->
  <ellipse cx="16" cy="18" rx="9" ry="8" fill="#E8F5E9"/>
  <!-- Left eye -->
  <circle cx="12" cy="16" r="3.5" fill="white"/>
  <circle cx="12" cy="16" r="2" fill="#1A2332"/>
  <circle cx="12.8" cy="15.2" r="0.7" fill="white"/>
  <!-- Right eye -->
  <circle cx="20" cy="16" r="3.5" fill="white"/>
  <circle cx="20" cy="16" r="2" fill="#1A2332"/>
  <circle cx="20.8" cy="15.2" r="0.7" fill="white"/>
  <!-- Beak -->
  <polygon points="16,19 14.5,21.5 17.5,21.5" fill="#FFB74D"/>
  <!-- Graduation cap -->
  <polygon points="16,4 6,9 16,12 26,9" fill="#1A2332"/>
  <rect x="14.5" y="4" width="3" height="2" fill="#1A2332"/>
  <line x1="24" y1="9" x2="24" y2="13" stroke="#FFB74D" stroke-width="1"/>
  <circle cx="24" cy="13.5" r="1" fill="#FFB74D"/>
</svg>
